name: C Project CI

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонирование репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка зависимостей
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc valgrind cppcheck clang-format libcheck-dev

      # 3. Проверка наличия исходных файлов
      - name: Check for source files
        run: |
          echo "🔍 Checking for source files..."
          if [ ! -d "src" ] || [ -z "$(find src -name '*.c' 2>/dev/null)" ]; then
            echo "❌ No source files found in src/ directory"
            echo "   Source files are required for this project."
            echo "   Please add source files to enable testing."
            exit 1
          fi
          echo "✅ Source files found:"
          find src -name '*.c' | sed 's/^/  /'
        shell: bash

      # 4. Проверка стиля кода (clang-format)
      - name: Check code style (clang-format)
        run: |
          echo "🔍 Checking code style..."
          clang-format --version
          clang-format --dry-run --Werror $(find src include tests -name '*.c' -o -name '*.h' 2>/dev/null)
        shell: bash

      # 5. Статический анализ (cppcheck)
      - name: Run static analysis (cppcheck)
        run: |
          echo "🧠 Running cppcheck..."
          cppcheck --enable=all --inconclusive --std=c11 \
            --force --error-exitcode=1 \
            -I include src tests
        shell: bash

      # 6. Сборка проекта
      - name: Build project
        run: |
          echo "🏗️ Building project..."
          make clean
          make build_if_available
        shell: bash

      # 7. Запуск тестов
      - name: Run tests
        run: |
          echo "🧪 Running tests..."
          if [ ! -d "tests" ] || [ -z "$(find tests -name '*.c' 2>/dev/null)" ]; then
            echo "❌ No test files found in tests/ directory"
            echo "   Test files are required for this project."
            echo "   Please add test files to enable testing."
            exit 1
          fi
          make test_implemented
        shell: bash

      # 8. Проверка утечек памяти
      - name: Memory check (valgrind)
        run: |
          echo "🔬 Checking for memory leaks..."
          if [ ! -f "${{ github.workspace }}/build/bin/tests/test" ]; then
            echo "❌ Test binary not found - build or tests failed"
            exit 1
          fi
          valgrind --leak-check=full --error-exitcode=1 ./${{ github.workspace }}/build/bin/tests/test
        shell: bash
